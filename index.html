<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NBA 對戰預測</title>
  <meta name="description" content="用 NBA 例行賽數據，預測任意兩支 NBA 球隊對戰的比分與勝負。">
  <link rel="stylesheet" href="style.css">
  <script>
    // 主題：邏輯放在網頁檔自己裡面（不放在 app.js），這樣就算手機還留著舊的 app.js，主題按鈕也一定點得動
    // 之前選過的主題：在畫面出來之前先套上，才不會先閃一下預設顏色
    try { var t = localStorage.getItem("nba-theme"); if (/^(white|khaki|dark|black)$/.test(t)) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    // 目前生效的主題：選過的，沒選過就跟系統（淺色 = 卡其、深色 = 黑色）；按鈕的亮起也在這裡處理
    window.nbaMarkTheme = function () {
      var cur = document.documentElement.getAttribute("data-theme") ||
        (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "black" : "khaki");
      var bs = document.querySelectorAll("#theme-pick .tp-btn");
      for (var i = 0; i < bs.length; i++) bs[i].setAttribute("aria-pressed", bs[i].getAttribute("data-t") === cur ? "true" : "false");
    };
    document.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("#theme-pick .tp-btn") : null;
      if (!b) return;
      var t = b.getAttribute("data-t");
      document.documentElement.setAttribute("data-theme", t);
      try { localStorage.setItem("nba-theme", t); } catch (err) { /* 瀏覽器不讓存就只有這次有效 */ }
      window.nbaMarkTheme();
      window.dispatchEvent(new Event("nba-theme"));  // app.js 聽到會重畫（隊色、投票條要跟著主題重算）
    });
    document.addEventListener("DOMContentLoaded", window.nbaMarkTheme);  </script>
</head>
<body>
  <main class="wrap">

    <header class="hero">
      <h1><span class="logo" id="page-kicker">NBA</span><span id="page-title">對戰預測</span></h1>
      <div class="theme-pick" id="theme-pick" role="group" aria-label="選擇主題">
        <span class="tp-label">主題</span>
        <button type="button" class="tp-btn" data-t="white" aria-pressed="false"><span class="tp-dot"></span>白色</button>
        <button type="button" class="tp-btn" data-t="khaki" aria-pressed="false"><span class="tp-dot"></span>卡其</button>
        <button type="button" class="tp-btn" data-t="dark" aria-pressed="false"><span class="tp-dot"></span>深色</button>
        <button type="button" class="tp-btn" data-t="black" aria-pressed="false"><span class="tp-dot"></span>黑色</button>
      </div>
    </header>

    <aside class="notice" id="notice" role="note"></aside>

    <nav class="tabs" id="tabs" aria-label="頁面切換" hidden>
      <button type="button" class="tab" id="tab-home">首頁</button>
      <button type="button" class="tab" id="tab-schedule">賽程</button>
      <button type="button" class="tab" id="tab-vote" hidden>投票</button>
      <button type="button" class="tab" id="tab-matchup">自選對戰</button>
      <button type="button" class="tab" id="tab-stats">準確率</button>
    </nav>

    <!-- 首頁：三個大項目，賽程放最主要 -->
    <section id="view-home" class="home" aria-label="首頁" hidden>
      <div class="home-card home-main">
        <a class="home-result" id="home-result" href="#tab=schedule" hidden>今日賽果</a>
        <a class="home-link" href="#tab=schedule">
          <span class="home-title">📅 賽程</span>
          <span class="home-desc" id="home-schedule-desc">明天的比賽預測</span>
        </a>
        <details class="home-games" id="home-games-box" hidden>
          <summary id="home-games-sum">展開看預測</summary>
          <ul class="game-list" id="home-games"></ul>
        </details>
      </div>
      <div class="home-row">
        <a class="home-card" href="#tab=matchup">
          <span class="home-title">⚔️ 自選對戰</span>
          <span class="home-desc">任選兩支球隊，看預測資訊</span>
        </a>
        <a class="home-card" href="#tab=stats">
          <span class="home-title">🎯 準確率</span>
          <span class="home-desc">📊 統計數據</span>
          <span class="home-sub" id="home-stats-sub"></span>
        </a>
      </div>

      <a class="home-card home-vote" id="home-vote" href="#tab=vote" hidden>
        <span class="home-title">🗳️ 投票專區</span>
        <span class="home-desc">要當作 pop cat 按也可以</span>
      </a>

      <!-- 傷病名單：點開後選東區 / 西區，每隊一列，再點隊伍展開那隊的傷病（即時從 ESPN 抓，點開才抓） -->
      <details class="home-card inj-home" id="inj-home">
        <summary>
          <span class="home-title">🚑 傷病名單</span>
        </summary>
        <div class="inj-home-body">
          <div class="seg" role="group" aria-label="選擇分區">
            <button type="button" class="seg-btn" id="inj-east" aria-pressed="true">東區</button>
            <button type="button" class="seg-btn" id="inj-west" aria-pressed="false">西區</button>
          </div>
          <p class="inj-warn">預測數據沒有參考傷病</p>
          <div id="inj-teams"></div>
          <p class="inj-note" id="inj-home-note"></p>
        </div>
      </details>

      <!-- 排名：東區 / 西區 -->
      <div class="card standings" id="standings">
        <div class="st-head">
          <h2>排名</h2>
          <div class="seg" role="group" aria-label="選擇分區">
            <button type="button" class="seg-btn" id="st-east" aria-pressed="true">東區</button>
            <button type="button" class="seg-btn" id="st-west" aria-pressed="false">西區</button>
          </div>
        </div>
        <table class="st-table">
          <thead><tr><th>#</th><th>球隊</th><th>勝</th><th>敗</th><th>勝差</th><th>近況</th></tr></thead>
          <tbody id="st-body"></tbody>
        </table>      </div>
    </section>

    <!-- 準確率：已完賽比賽的預測成績（用開賽前的數據算，全部在瀏覽器裡統計） -->
    <section id="view-stats" aria-label="準確率" hidden>
      <div id="stats-page"></div>
    </section>

    <!-- 投票專區：選日期，每場猜客隊贏還是主隊贏（不擋重複投票），開賽後鎖票、賽後對照結果 -->
    <section id="view-vote" class="vote" aria-label="投票專區" hidden>
      <div class="datebar">
        <button type="button" id="vote-prev" class="icon-btn" aria-label="前一個比賽日" title="前一個比賽日">◀</button>
        <span class="vote-date" id="vote-date"></span>
        <button type="button" id="vote-next" class="icon-btn" aria-label="後一個比賽日" title="後一個比賽日">▶</button>
      </div>
      <p class="vote-intro">開賽前都能投，想投幾次都可以</p>
      <p class="vote-msg" id="vote-msg" role="alert" hidden></p>
      <ul class="game-list" id="vote-list"></ul>
      <p class="day-summary" id="vote-summary" hidden></p>
    </section>

    <!-- 第二層：選日期，列出那天的賽程，點一場進到那場的預測 -->
    <section id="view-schedule" class="schedule" aria-label="賽程" hidden>
      <div class="datebar">
        <button type="button" id="date-prev" class="icon-btn" aria-label="前一個比賽日" title="前一個比賽日">◀</button>
        <input type="date" id="date-input" aria-label="選擇日期（台灣日期）">
        <button type="button" id="date-next" class="icon-btn" aria-label="後一個比賽日" title="後一個比賽日">▶</button>
        <button type="button" id="date-today" class="chip">今天</button>
      </div>
      <ul class="game-list" id="game-list"></ul>
      <p class="day-summary" id="day-summary" hidden></p>
      <div class="game-empty" id="game-empty" hidden>
        <p id="game-empty-text"></p>
        <button type="button" id="jump-next" class="chip" hidden></button>
      </div>
    </section>

    <!-- 第一層：自選兩支球隊 -->
    <div id="view-matchup">

    <p class="back" id="back" hidden><a id="back-link" href="#">← 回到賽程</a></p>

    <!-- 從賽程點進來時：同一天的比賽之間切換 -->
    <div class="gamenav" id="gamenav" hidden>
      <button type="button" id="game-prev" class="chip">◀ 上一場</button>
      <span class="game-pos" id="game-pos"></span>
      <button type="button" id="game-next" class="chip">下一場 ▶</button>
    </div>

    <section class="picker" id="picker" aria-label="選擇球隊">
      <div class="side">
        <label for="away">客隊（客場）</label>
        <select id="away"></select>
      </div>
      <button id="swap" type="button" class="swap" aria-label="交換主客場" title="交換主客場">⇄</button>
      <div class="side">
        <label for="home">主隊（主場）</label>
        <select id="home"></select>
      </div>
    </section>

    <p id="neutral-note" class="neutral-note" hidden>中立場地：這場沒有主場，預測不加主場優勢。</p>

    <p id="hint" class="hint" role="alert" hidden></p>

    <section id="result" class="result" aria-live="polite" hidden>

      <!-- 已完賽的固定頁面：第一張卡 = 實際比分，第二張卡 = 賽前預測、信心、各選項對錯（取代下面那塊記分板） -->
      <div class="card final-board" id="final-board" hidden>
        <div class="board-title"><span class="tag">已完賽</span></div>
        <div class="board-row">
          <div class="team" id="final-away"></div>
          <div class="vs">@</div>
          <div class="team" id="final-home"></div>
        </div>
      </div>
      <div class="card pre-board" id="pre-board" hidden></div>

      <div class="card board" id="board-card">
        <div class="board-title">
          <span class="tag" id="verdict-tag"></span>
        </div>
        <div class="board-row">
          <div class="team" id="board-away"></div>
          <div class="vs">@</div>
          <div class="team" id="board-home"></div>
        </div>
        <p class="margin" id="board-margin"></p>
        <div class="alt" id="alt" hidden></div>
        <div class="h2h" id="h2h"></div>
      </div>

      <!-- 投票：從賽程點進來的比賽才有，放在兩隊對戰紀錄下面、本季數據對照上面 -->
      <div class="card vote-card" id="vote-card" hidden></div>

      <!-- 兩隊得分前三高的球員對照：放在投票下面、本季數據對照上面 -->
      <div class="card players-card" id="players-card" hidden></div>

      <div class="card">
        <h2 id="stats-title"></h2>
        <table class="stats">
          <thead>
            <tr><th id="s-away"></th><th>指標</th><th id="s-home"></th></tr>
          </thead>
          <tbody id="stats-body"></tbody>
        </table>
      </div>

      <!-- 傷病名單：放在賭盤上面，打開頁面時即時去抓（預測數據沒有參考傷病） -->
      <div class="card inj-card" id="inj-card" hidden></div>

      <!-- 現在的盤口：只有「還沒打完」的比賽才會出現，打開頁面時即時去抓 -->
      <div id="odds-card" hidden>
        <div class="card" id="odds-body"></div>
        <p class="odds-note" id="odds-note"></p>
      </div>

      <!-- 依預測選擇：照我們預測的比分，對著上面的盤口會選哪些選項 -->
      <div class="card picks-card" id="picks-card" hidden></div>

    </section>

    </div><!-- /view-matchup -->

    <footer class="foot">
      <p id="foot-text"></p>
    </footer>

  </main>

  <script src="data/teams.js"></script>
  <script src="data/schedule.js"></script>
  <script src="data/players.js"></script>
  <script src="app.js"></script>
</body>
</html>
