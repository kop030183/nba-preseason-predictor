<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NBA 對戰預測</title>
  <meta name="description" content="用 NBA 例行賽數據，預測任意兩支 NBA 球隊對戰的比分與勝負。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">

    <header class="hero">
      <h1 id="page-title">NBA 對戰預測</h1>
    </header>

    <aside class="notice" id="notice" role="note"></aside>

    <nav class="tabs" id="tabs" aria-label="頁面切換" hidden>
      <button type="button" class="tab" id="tab-matchup">自選對戰</button>
      <button type="button" class="tab" id="tab-schedule">賽程</button>
    </nav>

    <!-- 第二層：選日期，列出那天的賽程，點一場進到那場的預測 -->
    <section id="view-schedule" class="schedule" aria-label="賽程" hidden>
      <div class="datebar">
        <button type="button" id="date-prev" class="icon-btn" aria-label="前一個比賽日" title="前一個比賽日">◀</button>
        <input type="date" id="date-input" aria-label="選擇日期（台灣日期）">
        <button type="button" id="date-next" class="icon-btn" aria-label="後一個比賽日" title="後一個比賽日">▶</button>
        <button type="button" id="date-today" class="chip">今天</button>
      </div>
      <p class="date-note">日期和開賽時間都是台灣時間。可以看「前一個比賽日」（賽前預測與結果）和之後的日期，更早的不能選；◀ ▶ 是跳到前／後一個比賽日。點一場比賽，看那場的預測。</p>
      <ul class="game-list" id="game-list"></ul>
      <div class="game-empty" id="game-empty" hidden>
        <p id="game-empty-text"></p>
        <button type="button" id="jump-next" class="chip" hidden></button>
      </div>
    </section>

    <!-- 第一層：自選兩支球隊 -->
    <div id="view-matchup">

    <p class="back" id="back" hidden><a id="back-link" href="#">← 回到賽程</a></p>

    <!-- 從賽程點進來時：同一天的比賽之間切換 -->
    <div class="gamenav" id="gamenav" hidden>
      <button type="button" id="game-prev" class="chip">◀ 上一場</button>
      <span class="game-pos" id="game-pos"></span>
      <button type="button" id="game-next" class="chip">下一場 ▶</button>
    </div>

    <!-- 已完賽的比賽：說明下面是賽前預測，並對照實際比分 -->
    <div class="pregame" id="pregame" hidden></div>

    <section class="picker" aria-label="選擇球隊">
      <div class="side">
        <label for="away">客隊（客場）</label>
        <select id="away"></select>
      </div>
      <button id="swap" type="button" class="swap" aria-label="交換主客場" title="交換主客場">⇄</button>
      <div class="side">
        <label for="home">主隊（主場）</label>
        <select id="home"></select>
      </div>
    </section>

    <p id="neutral-note" class="neutral-note" hidden>中立場地：這場沒有主場，預測不加主場優勢。</p>

    <p id="hint" class="hint" role="alert" hidden></p>

    <section id="result" class="result" aria-live="polite" hidden>

      <div class="card board">
        <div class="board-title">
          <span class="tag" id="verdict-tag"></span>
        </div>
        <p class="summary" id="summary" hidden></p>
        <div class="board-row">
          <div class="team" id="board-away"></div>
          <div class="vs">@</div>
          <div class="team" id="board-home"></div>
        </div>
        <p class="margin" id="board-margin"></p>
        <div class="alt" id="alt" hidden></div>
        <div class="h2h" id="h2h"></div>
      </div>

      <div class="card">
        <h2 id="stats-title"></h2>
        <table class="stats">
          <thead>
            <tr><th id="s-away"></th><th>指標</th><th id="s-home"></th></tr>
          </thead>
          <tbody id="stats-body"></tbody>
        </table>
      </div>

    </section>

    </div><!-- /view-matchup -->

    <footer class="foot">
      <p id="foot-text"></p>
    </footer>

  </main>

  <script src="data/teams.js"></script>
  <script src="data/schedule.js"></script>
  <script src="app.js"></script>
</body>
</html>
